services:
  onedrive-backup:
    image: ${ONEDRIVE_IMAGE:-vasilyvz/onedrive-backup:0.3.24}
    container_name: onedrive-backup
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8443:8050"
    volumes:
      - /etc/onedrive-backup:/config:ro
      - /srv/archive/onedrive-backup:/data:rw
      - /var/lib/onedrive-backup/rclone-state:/rclone-state:rw
    networks:
      smart-assistant:
        aliases: [onedrive-backup]
    security_opt: [no-new-privileges:true]
networks:
  smart-assistant:
    external: true
