services:
  onedrive-backup:
    image: ${ONEDRIVE_IMAGE:-vasilyvz/onedrive-backup:0.3.16}
    container_name: onedrive-backup
    restart: unless-stopped
    user: "1000:1000"
    expose:
      - "8050"
    volumes:
      - /etc/onedrive-backup:/config:ro
      - /srv/backup/onedrive:/data:rw
    networks:
      smart-assistant:
        aliases: [onedrive-backup]
    security_opt: [no-new-privileges:true]
networks:
  smart-assistant:
    external: true
