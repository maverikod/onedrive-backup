 "SC4 names LINE_TOO_LARGE and LINE_TOO_LONG for one case: the code is LINE_TOO_LONG (problem list of 10.20.3)", "10.20.3 CLIENT AND CLI counts: 11 old commands plus M12-M14 are 14 before rev 12 and 17 after; the live help list is 17 commands", "10.20.8 PK1 text fragment: on 0.3.22 PL13 keeps the timer enabled and shipped, expected disabled and absent", "SC5 and SC8 valid texts are sent with dry_run true: the live service is production only and a pipeline case must not write (10.20.7 safety rule); the real write is SC6 in schedule_live", "status record keys and the error.data shape of INVALID_SCHEDULE and SCHEDULE_CONFLICT follow 10.20.3 (error.data.problems, current_revision, current_text); the tester reads error.data or error.details"], "changed_text": {"V1": "service page tab row gains svc-tab-schedule (vue_static_serve)", "V3": "manifest and live help list 17 commands (vue_command_contract, b4base.COMMANDS)", "V4": "route #/service?section=schedule sends exactly get and status (vue_command_calls)", "V7": "status poll only while the schedule section is visible, 15000 ms (vue_polling)", "R26": "route and logout rules extend to the schedule calls", "R28": "route and logout rules extend to the schedule calls", "PL13": "RETIRED(SCHEDULE-REV12), replaced by PL15", "timer_state_preserved": "deprecated, replaced_by timer_retired"}, "tester": "tester-89"}
