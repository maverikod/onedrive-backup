  {"id": "R7", "rows": "AU1,AU2,AU4,AU5,AU6,PX10,O16", "rule": "authentication and transport (revision 8, REPLACED): TLS server-auth is mandatory (server.protocol https, set by the adapter configuration alone; plain HTTP refused); no client certificate is requested or checked; the service is open for now (auth.use_token false), so there is no 401 gate; the later password mode is the adapter static key sent as X-API-Key, configuration only"},
  {"id": "R8", "rows": "U1-U10", "rule": "the server UI is REMOVED in 0.3.12 (commit 347c327): ui.py, admin_password.py, the admin CLI and the admin-password.hash gate no longer exist, so no /ui route and no hash file remain in S0 or in S1; the removal is asserted by vue_static_serve (U1), vue_auth (U2-U4), vue_command_calls (U5-U8, U10) and vue_download (U9) through vuebase removed_ui"},
  {"id": "R9", "rows": "K7,K8,C-K12,C-K13", "rule": "client fetch and download: an existing output without overwrite fails before any network call; size and SHA256 are verified before os.replace; on mismatch the temporary file is removed and the target is untouched; delete_after removes the export only after a successful verification; download without a path takes the whole snapshot"},
  {"id": "R10", "rows": "O12,O13", "rule": "odbcli flags map to the client: --force is overwrite, --delete-after on fetch and --keep-export on download mirror delete_after of K7 and K8"},
  {"id": "R11", "rows": "VR1", "rule": "version: VERSION equals client pyproject, client __version__, server version (S:64,75,387; I:290), image tag and deb; CURRENT violation client __init__ 0.3.3 against VERSION 0.3.6"},
  {"id": "R12", "rows": "PX3,PX9", "rule": "pipeline environment: PIPELINE_ENV by branch (main prod, other dev, contradiction refused); for this production-only service every _DEV value equals its _PROD value; values only from the committed pipeline/endpoints.env, no secrets, no hardcode; CURRENT violation pipeline/__main__.py:44-45 (bug 7201e383)"},
  {"id": "R13", "rows": "all live rows", "rule": "the full pipeline against production runs only on the explicit user command; targeted named checks run per block; S1 cases cannot run before the owner actions and are RED with an explicit reason, never skipped"},
  {"id": "R14", "rows": "C-K0,AU1,AU2,OS2,V1", "rule": "transport (revision 8, AMENDED): all callers - the model through the MCP Proxy, the Python client, odbcli, the SPA and the pipeline - use JSON-RPC POST /api/jsonrpc over TLS on the same service port; the SPA and /downloads are on the same origin; the service port is published on the LAN (host 8443 -> container 8050, ONEDRIVE_BACKUP_LAN_URL of endpoints.env); inside the docker network the proxy reaches https://onedrive-backup:8050"},
  {"id": "R16", "rows": "PL1,PL2,PL3,PL9", "rule": "scaffold gate = f(host data directory, container mount, secrets): S0 when any of host directory, /data mount in the container or secrets is missing; S1 only when the host directory is correct, /data is a real mount point, restic password and login/password in .env exist and the inventory is complete; the error code names the cause. REVISION 9 (D9): the filesystem guard is a REFUSAL, never a state: when the guard of PL9 fails, start/init/check/backup/discover refuse with exit 1 and never degrade to the S0 scaffold; S0 and S1 are evaluated only after the guard passed; the error text names the cause"},
  {"id": "R17", "rows": "PX11,AU2,AU6,every live row that sends a password", "rule": "run credentials (revision 8): ONEDRIVE_BACKUP_PASSWORD is the only credential and is OPTIONAL; absent = no header = GREEN against the open service, never [ENVIRONMENT]; when supplied it comes from a 0600 git-ignored env file by path (N2 mode wider than 0600, N4 tracked or not ignored: RED [ENVIRONMENT]) and never appears in stdout or stderr (N5); ONEDRIVE_BACKUP_LOGIN is removed"},
  {"id": "R18", "rows": "AU3", "rule": "RETIRED(TRANSPORT-REV8): there is one caller class; the peer class never decides a credential and no transport-peer admission exists (the proxy is an ordinary caller)"},
  {"id": "R19", "rows": "PL9,PL12", "rule": "the filesystem guard applies to deploy.sh, postinst and docker-run.sh with the same condition (/srv/archive is a mount point, the realpath of the data directory is /srv/archive or below it, findmnt -T of it is /srv/archive or below it and never /) and the same refusal contract; deploy.sh and postinst refuse BEFORE any mutation of the data directory; postinst never creates the data directory"},
  {"id": "R20", "rows": "PL10,PL1,PL9", "rule": "ONEDRIVE_DATA_DIR from the environment wins over /etc/default/onedrive-backup, which wins over the built-in default /srv/archive/onedrive-backup (deploy.sh and docker-run.sh); the guard is applied to the resolved value, so an explicit ONEDRIVE_DATA_DIR on the root filesystem is refused"},
  {"id": "R21", "rows": "PL11", "rule": "S (the original rclone.conf under /secrets) is read-only for the service; C (/rclone-state/rclone.conf) is the only rclone config the container reads; seeding: S missing or empty -> no seeding and scaffold, C never deleted; C absent or empty -> seed; S newer than C -> re-seed; otherwise keep C; the seed is a temporary file in the state directory renamed onto C; C is mode 0600 owner onedrive-backup in the 0700 state directory; /rclone-state is a read-write directory mount and /secrets stays readonly"},
  {"id": "R26", "rows": "C-K0,OS2,AU6", "rule": "client and odbcli connection cells (revision 8, K0): url REQUIRED and https://; ca optional; cert and key optional and ALL-OR-NONE (exactly both or neither; one without the other is a ClientError or an odbcli usage/config error, exit 1 or 2 as the live validation decides); with neither the adapter JsonRpcClient protocol is https, with both it is mtls; password optional (sent as X-API-Key when set, no auth header when absent); the login and token cells are removed; REQUIRED of odbcli is {url}"},
  {"id": "R27", "rows": "AU5,PX3,F1,F2,F3,F4,F5,F6,F7,F8,F9", "rule": "adapter-only transport (revision 8): no project code reads or compares server.protocol, filters routes, adds middleware, builds an SSL context or reads credentials; the only project hooks are command registration, set_public_download_resolver, the transfer config and exactly ONE StaticFiles mount (the LAST route, GET and HEAD only); the later mtls switch edits only the config_contract expected value and the TLS client-certificate cases by a new revision"}
