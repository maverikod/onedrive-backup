  {"id": "R4", "rows": "M6,M7,M11,O16,H8,H9,H10", "rule": "export lifecycle: status, download, delete and download_begin need an existing, unexpired (TTL 24 h) export_id from prepare; delete is not idempotent (repeat gives 404); an expired export cannot be deleted (410); no TTL cleanup exists (finding F3)"},
