  {"id": "R6", "rows": "M3,M4,M5,M6,M7,M11,O16", "rule": "scaffold and storage gate: snapshots, files and prepare give 503 in scaffold mode, without a mount, without a repository, or with a restic password that is missing or wider than 0600; status, download and delete of an export never call _config (an unknown well-formed id gives 404 in S0)"},
  {"id": "R7", "rows": "AU1,AU2,AU3,AU4,AU5,PX10,O16", "rule": "authentication: mTLS is mandatory for every peer (CERT_REQUIRED, verify_client; revocation is done by the MCP Proxy); the token T (auth.use_token true) is required from direct peers only; the MCP Proxy peer is admitted on mTLS alone (R18); without a certificate or with an untrusted one the handshake is refused for every peer"},
  {"id": "R8", "rows": "U1-U10", "rule": "the server UI is REMOVED in 0.3.12 (commit 347c327): ui.py, admin_password.py, the admin CLI and the admin-password.hash gate no longer exist, so no /ui route and no hash file remain in S0 or in S1; the removal is asserted by vue_static_serve (U1), vue_auth (U2-U4), vue_command_calls (U5-U8, U10) and vue_download (U9) through vuebase removed_ui"},
