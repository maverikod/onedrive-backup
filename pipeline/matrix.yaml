  {"id": "R36", "rows": "BE1", "rule": "revision 10 (10.17.9 R30): the library error codes of this revision are DUPLICATE_SCAN_FAILED, DUPLICATE_FETCH_FAILED, DUPLICATE_INTEGRITY_MISMATCH, DUPLICATE_NAME_RESERVED, DUPLICATE_DIRECTORY_UNSUPPORTED; the entry error is the first one in the order scan, reserved, directory, fetch, integrity; each extra carries its own"},
  {"id": "R29", "rows": "V4,V8", "rule": "routes (10.18.2; named R26 in 10.18, R26 of this snapshot is the client connection rule): a route sends exactly its row's command and parameter set while it loads, no other command and no extra key; the data-field and data-raw cells of the page equal the client result for the same command and parameters (volatile fields excluded by name, none observed); a command error renders one error-banner and no row; an unknown hash route renders page-notfound (404, route not found) and sends no command"},
  {"id": "R30", "rows": "V5,V8", "rule": "export controls (10.18.4; named R27 in 10.18): export-start-snapshot and export-start-file exist only on the files page, export-start-file only in file rows and never in directory rows; export-delete and download-link only on the export card; a start click sends exactly one backup_prepare_download and disables its button until the answer; delete sends exactly one backup_delete_export and asks no confirmation (O-2 A)"},
  {"id": "R31", "rows": "V7,V2", "rule": "logout and polling (10.18.5; named R28 in 10.18): the logout control is always present (O-1 A); after it the SPA sends NO command of any method until the user navigates, an answer arriving after the logout is discarded, signin resumes; the discovery page polls every 30000 ms; the export card polls every 5000 ms only while the export is not final (O-3 A)"},
  {"id": "R1", "rows": "M3,M4,H5,H6", "rule": "validation order of backup_snapshots and backup_list_files: limit type and range, offset range, prefix path, only then restic (C:121,188-193 then _config C:54-70); in S0 an invalid limit gives 400, not 503"},
