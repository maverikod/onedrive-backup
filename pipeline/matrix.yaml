  {"id": "RR6", "rows": "M24,PL25", "rule": "revision 14: scrubbing: access_token=, refresh_token, client_secret, 'Authorization: Bearer', password= followed by a value and any rclone configuration value never occur in reason, in the M24 text, in the log file or in runs.jsonl"},
  {"id": "RR7", "rows": "M17", "rule": "revision 14: no scheduling effect: after any non-zero run next_run, missed, schedule.revision and the schedule file are as before; the engine neither retries nor skips because of the new status meaning"},
  {"id": "RR8", "rows": "M17,M24", "rule": "revision 14: M17 and M24 write nothing; the schedule sha256 72f24d42... and every snapshot are unchanged; reading a log never starts, stops or signals a backup"},
  {"id": "RG3", "rows": "PL20r", "rule": "task 121 (2026-11-25): every run of backup_run writes <data>/schedule/logs/<run_id>.log and, when its exit code is not 0, an end record with a reason of at most 500 characters; at most 500 run logs are kept"},
  {"id": "RT1", "rows": "M13,M14,M19", "rule": "revision 13 (10.21.5): all-or-none chain: drive_id requires site_id; dir requires drive_id; a violation is 400 INVALID_FOLDER_SCOPE (error.data lists the fields) reported before any value error"},
  {"id": "RT2", "rows": "M13,M14", "rule": "revision 13 (10.21.5): recursive requires drive_id (400 INVALID_FOLDER_SCOPE); for a site node the SPA omits it"},
  {"id": "RT3", "rows": "M13,M19", "rule": "revision 13 (10.21.5): for every node returned by M19 under (site_ids, dates, name_part), M13 with the node address and recursive true has total == node.file_count (a site node: M13 {site_id}); with recursive false (library, folder) total == node.direct_count"},
  {"id": "RT4", "rows": "M19", "rule": "revision 13 (10.21.5): partition: for a library or folder parent direct_count + sum(child.file_count over ALL pages) == parent.file_count; the file_count of the site nodes sum to M13 {} total; a site node's file_count equals the sum of its libraries"},
  {"id": "RT5", "rows": "M19", "rule": "revision 13 (10.21.5): the concatenation of the pages equals one big page; offset beyond total gives nodes [] with the exact total"},
  {"id": "RT6", "rows": "M13,M14,M19", "rule": "revision 13 (10.21.5): scope AND filters: a scope whose site is not among site_ids gives total 0 and no error; dates restrict the snapshots exactly as without scope; an empty group restricts nothing"},
  {"id": "RT7", "rows": "M13,M14", "rule": "revision 13 (10.21.5): no scope parameter at all == the 0.3.25 behaviour: the items equal the 0.3.25 items minus the added drive_id, the same total, order and paging"},
  {"id": "RT8", "rows": "M13,M14", "rule": "revision 13 (10.21.5): RF3 extended: every name suggested by M14 is the name of at least one M13 row for the same scope and filters, and the matcher is the same function"},
  {"id": "RT9", "rows": "M19", "rule": "revision 13 (10.21.5): pruning: a node is returned iff file_count >= 1; a name part that matches nothing gives nodes [] and total 0 at every level; the grammar errors of M13 apply unchanged"},
  {"id": "RT10", "rows": "M13,M19", "rule": "revision 13 (10.21.5): stored copies: both objects of a (primary, copy) pair are rows of the same folder: M13 returns them (is_copy, copy_index >= 1, no '.dup-' in the name) and the node counts include both"},
  {"id": "RS1", "rows": "M16", "rule": "revision 12 (10.20): dry_run true: no file, history, changes line or wake; written false; the same problems and next_runs as the real call would give"},
  {"id": "RS2", "rows": "M16", "rule": "revision 12 (10.20): the text is stored normalised: CRLF to LF, one final LF, trailing blanks of lines kept, comments kept byte for byte"},
  {"id": "RS3", "rows": "M16", "rule": "revision 12 (10.20): an equal text writes nothing: written false, changed false, previous_revision == revision, no history file, no changes line"},
  {"id": "RS4", "rows": "M16", "rule": "revision 12 (10.20): expected_revision absent: the last writer wins (the client libraries and the UI always send it)"},
  {"id": "RS5", "rows": "M15,M16,M17,V11", "rule": "revision 12 (10.20): next_runs and entries come from ONE function of the parsed schedule and an instant (the scheduler uses it): M17.next_run.start_utc == M15.next_runs[0].start_utc for the same revision"},
  {"id": "RS6", "rows": "M15,M17", "rule": "revision 12 (10.20): read-only: nothing is created even when the file or the directory is missing"},
  {"id": "RS7", "rows": "M16,PL16", "rule": "revision 12 (10.20): a corrupt stored file never blocks a valid set: the new text replaces it and the corrupt text goes to history/"},
  {"id": "RS8", "rows": "M15", "rule": "revision 12 (10.20): valid false: source is not file and problems has at least one error"},
  {"id": "RS9", "rows": "M17", "rule": "revision 12 (10.20): enabled false: state paused and next_run null; no entry: state idle and next_run null"},
  {"id": "RS10", "rows": "M16,M17,V11", "rule": "revision 12 (10.20): after a successful non-dry set the status schedule.revision equals the set revision within one tick (35 s) and baseline_utc >= the set time"},
  {"id": "RS11", "rows": "M17", "rule": "revision 12 (10.20): history is newest first, len <= history_limit, history_limit 0 gives []"},
  {"id": "RS12", "rows": "M16", "rule": "revision 12 (10.20): a set never starts, stops or signals a backup run"},
  {"id": "E1", "rows": "PL17", "rule": "revision 12 (10.20): not leader, scaffold, storage guard failing, disabled or no entry: NOTHING with the reason (not_leader, scaffold, storage_unavailable, paused, idle)"},
  {"id": "E2", "rows": "PL17", "rule": "revision 12 (10.20): startup grace: nothing starts earlier than 120 s after the thread started"},
  {"id": "E3", "rows": "PL17", "rule": "revision 12 (10.20): DUE: the newest slot S with baseline < S and planned start <= now"},
  {"id": "E4", "rows": "PL17", "rule": "revision 12 (10.20): SATISFIED: a run with started_at >= S whose status is ok, errors, refused or live; interrupted or launch_failed does not satisfy; at most 2 attempts per slot, the retry only after interrupted"},
  {"id": "E5", "rows": "PL17", "rule": "revision 12 (10.20): CATCH-UP: an unsatisfied S younger than CATCHUP hours starts ONE run (trigger catchup after planned start + 60 s); older slots are dropped; CATCHUP=0 disables"},
  {"id": "E6", "rows": "PL17", "rule": "revision 12 (10.20): OVERLAP: lock busy when a start is due gives SKIP_BUSY, a skipped_busy record and no retry"},
  {"id": "E7", "rows": "PL17", "rule": "revision 12 (10.20): one child at a time"},
  {"id": "E8", "rows": "PL17", "rule": "revision 12 (10.20): a start due at the instant a schedule edit is saved is decided by the new baseline"},
  {"id": "RG1", "rows": "PL15", "rule": "revision 12 (10.20): the schedule file is created only when absent, with ENABLED derived from the old timer state"},
  {"id": "RG2", "rows": "PL18", "rule": "revision 12 (10.20): every start of backup_run writes a start record and, unless killed, an end record"},
  {"id": "RF1", "rows": "M12,M13,M14,V9", "rule": "revision 11 (10.19.3, 10.19.5): groups AND, values OR, an empty group is no restriction; a site_id or date with no snapshot is no error and contributes nothing"},
  {"id": "RF2", "rows": "M13,M14,V9", "rule": "revision 11 (10.19.3): name pattern key() = casefold(NFC()) on both sides; no unescaped star = contains; any unescaped star = anchored full-name pattern; question mark and other characters literal; backslash-star is a literal star; at most 8 stars, 1..128 characters"},
  {"id": "RF3", "rows": "M13,M14", "rule": "revision 11 (10.19.5): every name returned by M14 for (site_ids, dates, text) is the name of a row of M13 for the same parameters with name_part equal to text; one matcher, two commands"},
  {"id": "RF4", "rows": "M12", "rule": "revision 11 (10.19.3): the dates of M12 depend on site_ids: the dates of the ticked sites, all sites when none is ticked"},
  {"id": "RF5", "rows": "M13", "rule": "revision 11 (10.19.4, 10.19.5): fixed order name key ascending, snapshot_time newest first; the concatenation of pages equals one big page; an offset beyond the total gives items [] and the exact total"},
  {"id": "RF6", "rows": "M13", "rule": "revision 11 (10.17.7, 10.19.4): a stored copy of rev 10 is returned with is_copy true, copy_index >= 1 and a name without the dup fragment; the primary of the pair has copy_index 0 and the same name"},
  {"id": "R32", "rows": "BE2,BE3", "rule": "revision 10 (10.17.9 R26): dry_run true -> the scan only, no fetch, no file, no restic call; dry_run false -> scan, sync, fetch, restic in that order"},
  {"id": "R33", "rows": "BE3", "rule": "revision 10 (10.17.9 R27): stored_as never equals any source name of its folder under key() and never equals the stored_as of another extra; evaluated before any write; a clash extends h by 4 hex digits"},
  {"id": "R34", "rows": "BE3", "rule": "revision 10 (10.17.9 R28): the sync always carries the protection argument of 10.17.4 (2); with no extras it changes nothing observable"},
  {"id": "R35", "rows": "BE3,BE1", "rule": "revision 10 (10.17.9 R29): restic backup runs after the fetch and only for the outcomes ok and duplicate_incomplete; for empty and source_emptied nothing is scanned, fetched, synced or snapshotted (10.14 unchanged)"},
  {"id": "R36", "rows": "BE1", "rule": "revision 10 (10.17.9 R30): the library error codes of this revision are DUPLICATE_SCAN_FAILED, DUPLICATE_FETCH_FAILED, DUPLICATE_INTEGRITY_MISMATCH, DUPLICATE_NAME_RESERVED, DUPLICATE_DIRECTORY_UNSUPPORTED; the entry error is the first one in the order scan, reserved, directory, fetch, integrity; each extra carries its own"},
  {"id": "R29", "rows": "V4,V8", "rule": "routes (10.18.2; named R26 in 10.18, R26 of this snapshot is the client connection rule): a route sends exactly its row's command and parameter set while it loads, no other command and no extra key; the data-field and data-raw cells of the page equal the client result for the same command and parameters (volatile fields excluded by name, none observed); a command error renders one error-banner and no row; an unknown hash route renders page-notfound (404, route not found) and sends no command"},
  {"id": "R30", "rows": "V5,V8", "rule": "export controls (10.18.4; named R27 in 10.18): export-start-snapshot and export-start-file exist only on the files page, export-start-file only in file rows and never in directory rows; export-delete and download-link only on the export card; a start click sends exactly one backup_prepare_download and disables its button until the answer; delete sends exactly one backup_delete_export and asks no confirmation (O-2 A)"},
  {"id": "R31", "rows": "V7,V2", "rule": "logout and polling (10.18.5; named R28 in 10.18): the logout control is always present (O-1 A); after it the SPA sends NO command of any method until the user navigates, an answer arriving after the logout is discarded, signin resumes; the discovery page polls every 30000 ms; the export card polls every 5000 ms only while the export is not final (O-3 A)"},
  {"id": "R1", "rows": "M3,M4,H5,H6", "rule": "validation order of backup_snapshots and backup_list_files: limit type and range, offset range, prefix path, only then restic (C:121,188-193 then _config C:54-70); in S0 an invalid limit gives 400, not 503"},
  {"id": "R2", "rows": "M5,H7,PL6", "rule": "prepare order: snapshot_id (C:257), mkdir exports (C:258), node listing (scaffold or mount), file_path (C:262-263). CURRENT defects F1 (mkdir before the 503) and F2 (invalid file_path gives 503 in S0). PLANNED(B3): file_path is checked before side effects and before _config"},
  {"id": "R3", "rows": "M5,H7", "rule": "file_path null XOR string: null archives the whole snapshot (sum of sizes limited), a string selects one file (node size limited); over max_export_bytes (default 10 GiB) gives 413; a directory or a missing node gives 404"},
  {"id": "R4", "rows": "M6,M7,M11,O16,H8,H9,H10", "rule": "export lifecycle: status, download, delete and download_begin need an existing, unexpired (TTL 24 h) export_id from prepare; delete is not idempotent (repeat gives 404); an expired export cannot be deleted (410); no TTL cleanup exists (finding F3)"},
  {"id": "R5", "rows": "M8,M9,M10,H2,H3,H4", "rule": "state preconditions: S0 gives 503 SCAFFOLD_ONLY for sites and libraries and 200 {ready:false, complete:false, state:SCAFFOLD_ONLY} for discovery status; without an inventory sites and libraries give 503 SOURCE_NOT_READY; incomplete scan gives DISCOVERY_INCOMPLETE. Order for libraries: site_id format 400, readiness 503, site lookup 404; for sites: readiness, query, limit and offset"},
  {"id": "R6", "rows": "M3,M4,M5,M6,M7,M11,O16", "rule": "scaffold and storage gate: snapshots, files and prepare give 503 in scaffold mode, without a mount, without a repository, or with a restic password that is missing or wider than 0600; status, download and delete of an export never call _config (an unknown well-formed id gives 404 in S0)"},
  {"id": "R7", "rows": "AU1,AU2,AU4,AU5,AU6,PX10,O16", "rule": "authentication and transport (revision 8, REPLACED): TLS server-auth is mandatory (server.protocol https, set by the adapter configuration alone; plain HTTP refused); no client certificate is requested or checked; the service is open for now (auth.use_token false), so there is no 401 gate; the later password mode is the adapter static key sent as X-API-Key, configuration only"},
  {"id": "R8", "rows": "U1-U10", "rule": "the server UI is REMOVED in 0.3.12 (commit 347c327): ui.py, admin_password.py, the admin CLI and the admin-password.hash gate no longer exist, so no /ui route and no hash file remain in S0 or in S1; the removal is asserted by vue_static_serve (U1), vue_auth (U2-U4), vue_command_calls (U5-U8, U10) and vue_download (U9) through vuebase removed_ui"},
  {"id": "R9", "rows": "K7,K8,C-K12,C-K13", "rule": "client fetch and download: an existing output without overwrite fails before any network call; size and SHA256 are verified before os.replace; on mismatch the temporary file is removed and the target is untouched; delete_after removes the export only after a successful verification; download without a path takes the whole snapshot"},
  {"id": "R10", "rows": "O12,O13", "rule": "odbcli flags map to the client: --force is overwrite, --delete-after on fetch and --keep-export on download mirror delete_after of K7 and K8"},
  {"id": "R11", "rows": "VR1", "rule": "version: VERSION equals client pyproject, client __version__, server version (S:64,75,387; I:290), image tag and deb; CURRENT violation client __init__ 0.3.3 against VERSION 0.3.6"},
  {"id": "R12", "rows": "PX3,PX9", "rule": "pipeline environment: PIPELINE_ENV by branch (main prod, other dev, contradiction refused); for this production-only service every _DEV value equals its _PROD value; values only from the committed pipeline/endpoints.env, no secrets, no hardcode; CURRENT violation pipeline/__main__.py:44-45 (bug 7201e383)"},
  {"id": "R13", "rows": "all live rows", "rule": "the full pipeline against production runs only on the explicit user command; targeted named checks run per block; S1 cases cannot run before the owner actions and are RED with an explicit reason, never skipped"},
  {"id": "R14", "rows": "C-K0,AU1,AU2,OS2,V1", "rule": "transport (revision 8, AMENDED): all callers - the model through the MCP Proxy, the Python client, odbcli, the SPA and the pipeline - use JSON-RPC POST /api/jsonrpc over TLS on the same service port; the SPA and /downloads are on the same origin; the service port is published on the LAN (host 8443 -> container 8050, ONEDRIVE_BACKUP_LAN_URL of endpoints.env); inside the docker network the proxy reaches https://onedrive-backup:8050"},
  {"id": "R16", "rows": "PL1,PL2,PL3,PL9", "rule": "scaffold gate = f(host data directory, container mount, secrets): S0 when any of host directory, /data mount in the container or secrets is missing; S1 only when the host directory is correct, /data is a real mount point, restic password and login/password in .env exist and the inventory is complete; the error code names the cause. REVISION 9 (D9): the filesystem guard is a REFUSAL, never a state: when the guard of PL9 fails, start/init/check/backup/discover refuse with exit 1 and never degrade to the S0 scaffold; S0 and S1 are evaluated only after the guard passed; the error text names the cause"},
  {"id": "R17", "rows": "PX11,AU2,AU6,every live row that sends a password", "rule": "run credentials (revision 8): ONEDRIVE_BACKUP_PASSWORD is the only credential and is OPTIONAL; absent = no header = GREEN against the open service, never [ENVIRONMENT]; when supplied it comes from a 0600 git-ignored env file by path (N2 mode wider than 0600, N4 tracked or not ignored: RED [ENVIRONMENT]) and never appears in stdout or stderr (N5); ONEDRIVE_BACKUP_LOGIN is removed"},
  {"id": "R18", "rows": "AU3", "rule": "RETIRED(TRANSPORT-REV8): there is one caller class; the peer class never decides a credential and no transport-peer admission exists (the proxy is an ordinary caller)"},
  {"id": "R19", "rows": "PL9,PL12", "rule": "the filesystem guard applies to deploy.sh, postinst and docker-run.sh with the same condition (/srv/archive is a mount point, the realpath of the data directory is /srv/archive or below it, findmnt -T of it is /srv/archive or below it and never /) and the same refusal contract; deploy.sh and postinst refuse BEFORE any mutation of the data directory; postinst never creates the data directory"},
  {"id": "R20", "rows": "PL10,PL1,PL9", "rule": "ONEDRIVE_DATA_DIR from the environment wins over /etc/default/onedrive-backup, which wins over the built-in default /srv/archive/onedrive-backup (deploy.sh and docker-run.sh); the guard is applied to the resolved value, so an explicit ONEDRIVE_DATA_DIR on the root filesystem is refused"},
  {"id": "R21", "rows": "PL11", "rule": "S (the original rclone.conf under /secrets) is read-only for the service; C (/rclone-state/rclone.conf) is the only rclone config the container reads; seeding: S missing or empty -> no seeding and scaffold, C never deleted; C absent or empty -> seed; S newer than C -> re-seed; otherwise keep C; the seed is a temporary file in the state directory renamed onto C; C is mode 0600 owner onedrive-backup in the 0700 state directory; /rclone-state is a read-write directory mount and /secrets stays readonly"},
  {"id": "R26", "rows": "C-K0,OS2,AU6", "rule": "client and odbcli connection cells (revision 8, K0): url REQUIRED and https://; ca optional; cert and key optional and ALL-OR-NONE (exactly both or neither; one without the other is a ClientError or an odbcli usage/config error, exit 1 or 2 as the live validation decides); with neither the adapter JsonRpcClient protocol is https, with both it is mtls; password optional (sent as X-API-Key when set, no auth header when absent); the login and token cells are removed; REQUIRED of odbcli is {url}"},
  {"id": "R27", "rows": "AU5,PX3,F1,F2,F3,F4,F5,F6,F7,F8,F9", "rule": "adapter-only transport (revision 8): no project code reads or compares server.protocol, filters routes, adds middleware, builds an SSL context or reads credentials; the only project hooks are command registration, set_public_download_resolver, the transfer config and exactly ONE StaticFiles mount (the LAST route, GET and HEAD only); the later mtls switch edits only the config_contract expected value and the TLS client-certificate cases by a new revision"}
 ],
 "result_contracts": {
  "M21": {"baseline": {"outcome": "success", "result": "{export_id, offset, length int (decoded bytes of this slice), eof bool (offset+length == total_size), total_size int, sha256 (of the WHOLE staged payload, == M5/M6 sha256), chunk_sha256 (of this decoded slice), encoding 'base64', data_b64 string}; offset == total_size gives length 0, eof true, data_b64 ''", "errors": "-32602 missing|unknown|type|value; 400 INVALID_OFFSET (error.data.total_size); 404 'Unknown export identifier' (the M6 text); 410 expired (the M6 text); 413 EXPORT_TOO_LARGE_FOR_CHUNKS (total_size > ONEDRIVE_CHUNK_MAX_EXPORT_BYTES 4194304, error.data.hint); 503 as M6; on 0.3.28 every call answers 'Command backup_download_chunk not found' (RED PRODUCT)", "side_effects": "none: no expiry extension, no file written, no export created (RM8)", "idempotent": true}, "cases": {
   "baseline": {"outcome": "success", "state": "S1", "expect": "ok:chunk", "assert": ["TM4: the first slice of a staged sample (150000-250000 bytes) has length 65536, eof false, total_size == M5 size_bytes, chunk_sha256 == sha256 of the decoded slice"]},
   "tm4_reassembly": {"outcome": "success", "state": "S1", "expect": "ok:chunk_all", "assert": ["TM4: slices of limit 65536 until eof: eof true only on the last slice, the length sum == total_size == size_bytes, sha256 of the concatenation == M5.sha256 == M6.sha256 (RM8)"]},
   "tm4_eof_at_total": {"outcome": "success", "state": "S1", "expect": "ok:chunk_eof", "assert": ["TM4: offset == total_size gives length 0, eof true, data_b64 ''"]},
   "tm4_offset_beyond": {"outcome": "error", "state": "S1", "expect": "cmd:400:INVALID_OFFSET", "assert": ["TM4: offset total_size+1 is 400 INVALID_OFFSET with error.data.total_size"]},
   "tm4_limit_max": {"outcome": "success", "state": "S1", "expect": "ok:chunk", "assert": ["TM4: limit 262144 is accepted, length <= 262144"]},
   "tm4_limit_over": {"outcome": "error", "state": "any", "expect": "rpc:value", "assert": ["TM4: limit 262145 is -32602 violation value"]},
   "tm4_limit_0": {"outcome": "error", "state": "any", "expect": "rpc:value", "assert": ["TM4: limit 0 is -32602 violation value"]},
   "tm4_export_id_value": {"outcome": "error", "state": "any", "expect": "rpc:value", "assert": ["TM4: export_id 'ABC' is -32602 violation value"]},
   "tm4_unknown_export": {"outcome": "error", "state": "S1", "expect": "cmd:404", "assert": ["TM4: a well-formed unknown export id is 404 with the M6 text 'Unknown export identifier'"]},
   "omit_export_id": {"outcome": "error", "state": "any", "expect": "rpc:missing", "assert": ["TM4: no export_id is -32602 violation missing naming export_id"]},
   "unknown_param": {"outcome": "error", "state": "any", "expect": "rpc:unknown", "assert": ["TM4: an unknown parameter path is -32602 violation unknown"]},
   "tm4_writes_nothing": {"outcome": "success", "state": "S1", "expect": "ok:nowrite", "assert": ["TM4: the export's expires_at, the exports listing and the snapshot list are unchanged before and after the slices (RM8, TM11)"]},
   "tm5_too_large": {"outcome": "error", "state": "S1", "expect": "cmd:413:EXPORT_TOO_LARGE_FOR_CHUNKS", "assert": ["TM5: the png sample of 8462735 bytes staged by M5 answers 413 EXPORT_TOO_LARGE_FOR_CHUNKS with error.data.hint; the export is still downloadable by url (size and sha256 equal) and is deleted afterwards"]},
   "tm12_latency": {"outcome": "success", "state": "S1", "expect": "ok:latency", "assert": ["TM12: one slice of limit 262144 answers within 1 s"]},
   "tm14_model_recipe": {"outcome": "success", "state": "S1", "expect": "ok:recipe", "assert": ["TM14: through the client's raw JSON-RPC surface only (no HTTP): M13 with collapse 'file', order_by 'snapshot_time' and fields gives a file_id; M5 {file_id, inline_max_bytes 65536} returns the bytes of a small file (exactly 2 calls) or M5 + the M21 loop + M7 for a larger one; the sha256 of the bytes equals the sha256 field; the M20 step joins with group B"]}}},
  "M24": {"baseline": {"outcome": "success", "result": "{run_id, name '<run_id>.log' or '.log.N' (a name, never a path), size_bytes, offset (the effective start), length, eof (offset+length == size_bytes), encoding 'utf-8', text (the slice decoded as UTF-8, replacement characters at a cut boundary), rotated bool}", "errors": "-32602 missing|unknown|type|value; 400 INVALID_RUN_ID (well-formed, no recorded run; hint 'take run_id from backup_schedule_status.history'); 404 RUN_LOG_NOT_FOUND (the run exists, its log does not; error.data.hint); 400 INVALID_LOG_RANGE (RR3, offset > size_bytes); on 0.3.28 every call answers 'Command backup_run_log not found' (RED PRODUCT)", "side_effects": "none: read-only, no lock the scheduler waits on, bounded by the 64 KiB slice (RR8)", "idempotent": true}, "cases": {
   "baseline_tail": {"outcome": "success", "state": "S1", "expect": "ok:runlog", "assert": ["TR5: {run_id of the newest run with log.available true, tail true} returns the last <= 16384 bytes, eof true, name == '<run_id>.log'"]},
   "tr5_slices_reassemble": {"outcome": "success", "state": "S1", "expect": "ok:runlog_all", "assert": ["TR5: slices from offset 0 with limit 65536 concatenate to size_bytes bytes, eof true only on the last (RR2)"]},
   "tr5_tail_last_bytes": {"outcome": "success", "state": "S1", "expect": "ok:runlog_tail", "assert": ["TR5: tail true with limit 1024 returns exactly the last min(1024, size_bytes) bytes, offset == size_bytes - length"]},
   "rr3_tail_with_offset": {"outcome": "error", "state": "S1", "expect": "cmd:400:INVALID_LOG_RANGE", "assert": ["TR5: tail true together with offset is 400 INVALID_LOG_RANGE with error.data.fields ['offset','tail'] (RR3)"]},
   "tr5_unknown_run_id": {"outcome": "error", "state": "S1", "expect": "cmd:400:INVALID_RUN_ID", "assert": ["TR5: a well-formed run_id of no recorded run is 400 INVALID_RUN_ID with a hint naming backup_schedule_status"]},
