 "relations": [
  {"id": "R1", "rows": "M3,M4,H5,H6", "rule": "validation order of backup_snapshots and backup_list_files: limit type and range, offset range, prefix path, only then restic (C:121,188-193 then _config C:54-70); in S0 an invalid limit gives 400, not 503"},
  {"id": "R2", "rows": "M5,H7,PL6", "rule": "prepare order: snapshot_id (C:257), mkdir exports (C:258), node listing (scaffold or mount), file_path (C:262-263). CURRENT defects F1 (mkdir before the 503) and F2 (invalid file_path gives 503 in S0). PLANNED(B3): file_path is checked before side effects and before _config"},
  {"id": "R3", "rows": "M5,H7", "rule": "file_path null XOR string: null archives the whole snapshot (sum of sizes limited), a string selects one file (node size limited); over max_export_bytes (default 10 GiB) gives 413; a directory or a missing node gives 404"},
  {"id": "R4", "rows": "M6,M7,M11,H8,H9,H10", "rule": "export lifecycle: status, download, delete and download_begin need an existing, unexpired (TTL 24 h) export_id from prepare; delete is not idempotent (repeat gives 404); an expired export cannot be deleted (410); no TTL cleanup exists (finding F3)"},
  {"id": "R5", "rows": "M8,M9,M10,H2,H3,H4", "rule": "state preconditions: S0 gives 503 SCAFFOLD_ONLY for sites and libraries and 200 {ready:false, complete:false, state:SCAFFOLD_ONLY} for discovery status; without an inventory sites and libraries give 503 SOURCE_NOT_READY; incomplete scan gives DISCOVERY_INCOMPLETE. Order for libraries: site_id format 400, readiness 503, site lookup 404; for sites: readiness, query, limit and offset"},
  {"id": "R6", "rows": "M3,M4,M5,M6,M7,M11", "rule": "scaffold and storage gate: snapshots, files and prepare give 503 in scaffold mode, without a mount, without a repository, or with a restic password that is missing or wider than 0600; status, download and delete of an export never call _config (an unknown well-formed id gives 404 in S0)"},
  {"id": "R7", "rows": "AU1,AU2,AU3,PX10", "rule": "authentication: mTLS is mandatory (CERT_REQUIRED, verify_client); revocation is done by the MCP Proxy; PLANNED(B4) adds the static interim token on /api/jsonrpc (use_token true); without or with an untrusted certificate the handshake is refused"},
  {"id": "R8", "rows": "U1-U10", "rule": "scaffold and the server UI: every /ui route needs admin-password.hash; in S0 it is absent and every /ui route gives 503 (removed with ui.py by UI-VUE)"},
