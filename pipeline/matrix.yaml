  "check_status": "legacy = function in pipeline/__main__.py; implemented = pipeline/checks/check_<name>.py; pending = registered stub that always FAILS; deprecated = replaced check that is not served, with replaced_by",
  "run_credentials": "ONEDRIVE_BACKUP_PASSWORD only, OPTIONAL (R17, revision 8): when set it is sent as the header X-API-Key exactly as it is (no login, no base64, nothing derived), loaded by path from the git-ignored 0600 env file named by ONEDRIVE_BACKUP_CREDENTIALS_FILE or taken from the environment of the run; an absent password sends no header and is GREEN against the open service, never [ENVIRONMENT]; an unusable file (N1 absent, N2 mode, N4 tracked or not ignored) is RED [ENVIRONMENT] or [STATE], never [PRODUCT]; no value is ever printed"
