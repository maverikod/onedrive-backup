# Verification execution discipline
# EVENT-SELECTED OPERATION CARD. Only `roles/triggers.yaml` selects this file.

principle: >-
  Verification is a named state transition, not open-ended confidence seeking. Execute it only
  when an active rule requires the exact evidence. One GREEN result binds the same target at the
  same observable state identity; unchanged evidence is reused, not regenerated.

preflight:
  - name the exact contract rule or user command that requires this verification
  - name the target, its available state identity, the exact command/read and the evidence it must return
  - consult already returned evidence before launching an agent, reading again or running a command
  - use an existing revision UUID, block hash, deployed version, commit or file identity; never create a new audit merely to prove that the identity is unchanged

allowed_execution:
  - the first execution required for the current target and state identity
  - the same named focused check once after a relevant implementation or deployed-state change in the prescribed RED/GREEN loop
  - exactly one final full pipeline after all required focused checks are GREEN, when the contract requires it
  - one fresh source read immediately before a mutation or dispatch that `source_freshness` or the planning common gate requires
  - one repeat explicitly ordered by the user; a scoped single-use permission authorizes no other repeat
  - a retry after a tool failure only when the failure was classified, produced no verdict, and the applicable tool rule permits retry

mandatory_reuse:
  - GREEN plus unchanged target identity closes that verification obligation
  - cite and reuse the existing command/result/readback instead of recreating it
  - a new agent, context compaction, handoff, elapsed time, model doubt or a desire for higher confidence does not change target state

prohibited:
  - an unrequired double-check, review-of-review, branch attestation, second semantic audit or second model verdict
  - rerunning the same command or rereading the same artifact after GREEN with no relevant state change
  - launching multiple agents to verify the same target/state tuple, sequentially or in parallel
  - repeating broad searches, hashes, diffs, context compilation or plan validation to rediscover an already established unchanged fact
  - weakening or replacing a required mechanical check with model inspection

failure: >-
  A verification without a named authorizing rule, or a repeated verification for an unchanged
  target/state tuple outside `allowed_execution`, is a contract defect. Stop it, reuse existing
  evidence and continue from the transition that evidence already authorizes.
