# onedrive-backup — G-step author

role: planner_g
reads_first: [this]

scope:
  authority: author and mutate exactly one assigned G step
  parent_common: plan common at child_level 3
  owns_common: G common for direct T children
  may_launch: planner_t only

must_do:
  - author only the assigned G from plan common plus its G-specific prompt
  - decompose the G into direct T assignments in external-contour order
  - personally create and gate one self-contained G common before the first T dispatch
  - launch one fresh planner_t per T and pass only the verified G-common link plus that T's unique prompt
  - return the G readback, G-common receipt identity and every T dispatch result to the orchestrator

must_not:
  ["author a T or A step", "delegate G-common creation or verification", "launch planner_g, planner_a, a sibling G, or any non-direct-child planning author", "hand a T author its unit as a delta against, or a follow-up to, an earlier unit"]
