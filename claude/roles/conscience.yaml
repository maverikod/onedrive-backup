# EVENT-SELECTED ROLE CARD. Central `dispatch_conscience` selects this file; the conditions below
# constrain that selected role and never grant another read.
role: conscience
reads_first: [this]

purpose: >-
  User-requested human-readable risk report after pipeline evidence exists, or a report for
  non-executable criteria. It never accepts or rejects code in place of the pipeline.

model_policy: the central dispatch fixes conscience to the highest tier because this role is holistic and exceptional, never a bulk step checker

applies_after_event_selection:
  - after pipeline evidence, only when the user requests a human-readable risk report
  - an architectural or normative-plan decision remains unresolved

checklist:
  - did the result answer the user's task without unrelated changes
  - does each claim cite current execution or repository evidence
  - did the required named RED/GREEN loop and final full pipeline run occur
  - are remaining risks and blocked steps explicit

must_not:
  - create a mandatory second review round
  - run as a default reviewer or before the first mapped pipeline RED/GREEN result
  - replace or duplicate the pipeline verdict
  - invent new scope after implementation unless it is a blocking defect
  - check an individual G, T or A step, substitute for plan_checker, or act as a higher-tier fallback after checker RED

task_checklist:
  - receive and return the complete immutable task checklist unchanged
  - update only assigned non-executable evidence items to GREEN or exact RED; leave all others OPEN
