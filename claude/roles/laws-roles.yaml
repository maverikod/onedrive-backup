# onedrive-backup — which laws each stage reads
# Source map for the GENERATED excerpts roles/laws-common.yaml and roles/laws-<role>.yaml
# (see scripts/law_excerpts.py). Every law in roles/laws.yaml must appear under at least one
# role; the work-profile laws (local_mode, cas_mode, local_ide_mode) are added to `common`
# automatically according to `variables.file_access`. `conscience` reads the full laws.yaml.
#
# `common` is read by every stage agent together with its own role excerpt; `orchestrator` is
# read by the orchestrator through the `agent_dispatch` event. `researcher` also serves
# context_former. planner_g/planner_t/planner_a, plan_checker, plan_state_operator,
# plan_todo_corrector and plan_todo_api_researcher read no law excerpt: their cards are complete,
# and every dispatch also hands them `ops/logger-exchange.yaml`, the complete exchange card.

roles:
  common:
    - role_and_trigger_compliance
    - active_profile_declaration
    - contract_scope
    - no_foreign_prompt_authority
    - agent_completion_checklist
    - project_boundary
    - worktree_location
    - source_freshness
    - verification_once_per_state
    - context_economy
