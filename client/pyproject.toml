[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onedrive-backup-client"
version = "0.2.0"
description = "mTLS console and Python client for OneDrive Backup service"
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
authors = [{name = "OneDrive Backup maintainers"}]
dependencies = []

[project.scripts]
onedrive-backup-client = "onedrive_backup_client.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["onedrive_backup_client*"]

