[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onedrive-backup-client"
version = "0.3.22"
description = "Python client and odbcli console command for the OneDrive Backup service"
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
authors = [{name = "OneDrive Backup maintainers"}]
dependencies = ["mcp-proxy-adapter==8.11.20"]

[project.scripts]
odbcli = "onedrive_backup_client.odbcli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["onedrive_backup_client*"]

