# Project check configuration read by the CAS/editor write gate (flake8 and
# mypy chain elements run with config_source=auto, i.e. their own discovery).
# Style is the measured style of the code base: longest line in src/ 124,
# client/ 127, tests/ 123 columns; pipeline/ carries long literal evidence
# strings (up to 308 columns) and is exempt from E501 only.

[flake8]
max-line-length = 127
exclude = .git,__pycache__,.venv,old_code,node_modules,dist,frontend,.mypy_cache,.terminals,.test-run
per-file-ignores =
    pipeline/*:E501

[mypy]
python_version = 3.12
warn_unused_configs = True
